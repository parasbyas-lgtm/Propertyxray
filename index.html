const TG={fact:'User-supplied',calc:'Calculation',claim:'Unverified claim',hyp:'Rule-based hypothesis'};

const RG={title:/title|deed|sale/i,enc:/encumb|lien/i,occ:/occup|completion|\boc\b|\bcc\b/i,plan:/plan|sanction/i,tax:/tax/i,society:/maint|society|receipt|noc/i,inspection:/inspect|survey|audit/i,brochure:/brochure|spec/i,agreement:/agreement|lease/i,ownership:/owner/i,utility:/bill|electric|water|utility/i};

const DEMO=()=>[
{id:'d1',demo:1,name:'Harbor Heights 2BHK',type:'buy',loc:'Sector 14, Fictional City',price:12500000,area:1050,maint:4200,beds:2,age:3,floor:'7 of 14',park:'yes',dep:'',url:'',desc:'Prime location, ready to move 2BHK in a gated society with gym and pool. Builder says the project is RERA registered. 10 minutes to metro.',notes:'Seen on a weekend open house (fictional).',docs:[{n:'brochure_harbor_heights.pdf',s:2400000,c:'brochure'},{n:'maintenance_receipts_2025.pdf',s:310000,c:'society'}]},
{id:'d2',demo:1,name:'Old Town 3BHK Independent Floor',type:'buy',loc:'Mill Lane, Fictional City',price:14000000,area:1600,maint:1500,beds:3,age:22,floor:'1 of 3',park:'unknown',dep:'',url:'',desc:'Urgent sale, owner abroad. Clear title, price negotiable. Guaranteed appreciation, great investment.',notes:'',docs:[]},
{id:'d3',demo:1,name:'Greenfield Studio',type:'rent',loc:'Greenfield Park, Fictional City',price:38000,area:520,maint:3500,beds:1,age:8,floor:'3 of 6',park:'no',dep:6,url:'',desc:'Furnished studio, no brokerage, gated with security. Owner relocating, need a tenant immediately.',notes:'',docs:[{n:'inspection_report_oct.pdf',s:880000,c:'inspection'}]}
].map(p=>(p.at=Date.now(),mig(p),p));
const P2=p=>S.props.filter(q=>q.id!==p.id&&q.type==='buy'&&+q.area>0&&+q.price>0);
function an(p){
 const buy=p.type==='buy',st=S.set,R={pos:[],risk:[],miss:[],claims:[],costs:[],qs:[],hi:0};
 const add=(k,t,x,sev)=>{R[k].push({t,x,sev});if(k==='risk'&&sev==='hi')R.hi++};
 const price=+p.price||0,area=+p.area||0,maint=+p.maint||0,age=(p.age===''||p.age==null)?null:+p.age,txt=(p.desc||'')+' '+(p.notes||''),dc=new Set(p.docs.filter(okdoc).map(d=>d.c));
 const rk=REQ[p.type];R.pps=buy&&area?price/area:0;
 const have=rk.filter(k=>dc.has(k));
 rk.filter(k=>!dc.has(k)).forEach(k=>{add('miss','calc',`${CATS[k]}: not attached`);R.qs.push(`Can you share the ${CATS[k].toLowerCase()}?`)});
 const fl=[[price,'asking price'],[p.loc,'location'],[area,'property area'],[maint,'monthly maintenance'],[age!==null,'building age'],[p.floor,'floor'],[p.park!=='unknown','parking'],[(p.desc||'').length>20,'listing description']];
 fl.filter(f=>!f[0]).forEach(f=>add('miss','calc',`Detail not provided: ${f[1]}`));
 R.score=Math.round(40*fl.filter(f=>f[0]).length/fl.length+60*have.length/rk.length);
 if(buy){['title','enc','occ'].forEach(k=>{if(!dc.has(k))add('risk','hyp',`No ${CATS[k].toLowerCase()} supplied. Ownership or legal status cannot be assessed from this data.`,'hi')});
  if(!dc.has('inspection'))add('risk','hyp','No independent inspection report. Structural, damp or wiring problems would go undetected.','med');
  if(age!==null&&age>=20){add('risk','hyp',`Building is ${age} years old (user-supplied). Ask about a structural audit, redevelopment plans and major repairs.`,'med');R.qs.push('Has a structural audit been done, and is any redevelopment or major repair planned?')}
  if(maint&&price&&maint*12/price>.01)add('risk','calc',`Annual maintenance is ${(maint*12/price*100).toFixed(1)}% of the price.`,'med');
  const m=med(P2(p).map(q=>q.price/q.area));
  if(m&&R.pps){const d=(R.pps/m-1)*100;
   if(d>20)add('risk','calc',`Price per sq ft is ${d.toFixed(0)}% above the median of your other saved sale listings (${fm(m)}). This is not a market benchmark.`,'med');
   else if(d<-20)add('risk','hyp',`Price per sq ft is ${(-d).toFixed(0)}% below your other saved sale listings. Unusually low: find out why (title, condition, location or a data-entry slip).`,'med')}
  R.qs.push('Why is the owner selling, and how long has it been listed?','Are there any loans, disputes or tenants linked to this property?');
 }else{const dm=(p.dep===''||p.dep==null)?null:+p.dep;
  if(!dc.has('agreement'))add('risk','hyp','No draft rental agreement supplied. Lock-in, escalation and exit terms are unknown.','med');
  if(!dc.has('ownership'))add('risk','hyp','No proof that the lister may rent this property out.','hi');
  if(!dc.has('inspection'))add('risk','hyp','No move-in inspection report. Existing damage could later be charged to your deposit.','med');
  if(dm&&dm>=6)add('risk','calc',`Deposit is ${dm} months of rent (${fm(price*dm)}). Confirm refund conditions and timeline.`,'med');
  if(maint&&price&&maint/price>.08)add('risk','calc',`Maintenance adds ${(maint/price*100).toFixed(0)}% on top of the rent.`,'med');
  R.qs.push('What are the lock-in period, annual increase and notice terms?','Under what conditions is the deposit refundable, and how fast?','Who pays for repairs, and how are requests handled?');}
 if(PRESS.test(txt))add('risk','hyp','Urgency or guarantee wording in the listing is a common pressure pattern. Do not let it shorten your verification.',GUAR.test(txt)?'hi':'med');
 if(p.park==='no')add('risk','fact','Parking is listed as unavailable (user-supplied).','lo');
 CL.forEach(([re,l,q])=>{if(re.test(txt)){add('claims','claim',`${l} in the listing text. Not verified; this app has not checked any document.`);if(q)R.qs.push(q)}});
 R.qs.push('What exactly does the maintenance charge cover, and are there pending dues or planned special levies?');
 const nd=p.docs.filter(okdoc).length,nt=p.docs.filter(d=>d.st==='ok').length;if(nd)add('pos','fact',`${nd} document(s) attached by you${nt?`, ${nt} with text read locally`:''}. A file being attached does not show that it is genuine, current, official or legally valid.`);
 if(dc.has('inspection'))add('pos','fact','An inspection report is on file. Read it yourself or with a professional.');
 if(buy&&age!==null&&age<=5)add('pos','fact',`Reported building age is ${age} years (user-supplied).`);
 if(p.park==='yes')add('pos','fact','Parking is listed as available (user-supplied, unverified).');
 if(R.score>=70)add('pos','calc',`Evidence completeness is ${R.score}/100.`);
 const E=ev(p),RV=E.cons.filter(c=>c.rev);R.ev=E;R.cx=RV.length;
 RV.forEach(c=>{add('risk','calc',esc(CK[c.k]+': '+c.x),c.sev);R.qs.push(c.q)});
 if(E.pend.length)add('miss','calc',`${E.pend.length} extracted fact(s) await your review on the Evidence tab and are not used in this analysis.`);

const nv=v=>{if(v===''||v==null)return null;const n=Number(String(v).replace(/,/g,''));return isFinite(n)&&n>=0?n:null};
const FN=5,sumA=a=>a.reduce((x,y)=>x+y,0);
function pmtOf(L,rate,yrs){const n=Math.round(yrs*12);if(!(L>0)||!(n>0))return 0;const r=rate/1200;return r===0?L/n:L*r/(1-Math.pow(1+r,-n))}
function balAfter(L,rate,yrs,k){const n=Math.round(yrs*12),r=rate/1200,pm=pmtOf(L,rate,yrs);k=Math.min(k,n);if(!(L>0))return 0;if(r===0)return Math.max(0,L-pm*k);const g=Math.pow(1+r,k);return Math.max(0,L*g-pm*(g-1)/r)}
function buyCalc(p,N){N=N||FN;const f=p.fin||{},price=+p.price>0?+p.price:null,area=+p.area>0?+p.area:null;
 const R={type:'buy',N,price,area,up:[],rec:[],exUp:[],exRec:[],notes:[],loan:null,pricePart:null,fees:0,works:0,upTotal:null,mon:null,monEx:0,ann:null,cash5:null,tco:null,pps:null,ppsm:null,partial:false,pm:0,interest:0,paid:0};
 if(price==null){R.notes.push('No asking price entered, so nothing can be calculated.');return R}
 const pc=(k,l)=>{const v=nv(f[k]);if(v==null){R.exUp.push(l);return 0}const a=price*v/100;R.up.push({l,v:a,n:v+'% of price (percentage entered by you)',t:'calc'});return a};
 const am=(k,l)=>{const v=nv(f[k]);if(v==null){R.exUp.push(l);return null}R.up.push({l,v,n:'Amount entered by you',t:'fact'});return v};
 let fees=pc('stamp','Stamp duty and registration')+pc('brok','Brokerage')+pc('legal','Legal and due-diligence fees');
 const dp=nv(f.down),rate=nv(f.rate),yrs=nv(f.yrs),have=[dp,rate,yrs].filter(z=>z!=null).length,n=yrs?Math.round(yrs*12):0;
 const finOk=dp!=null&&dp<=100&&rate!=null&&n>=1;let pm=0,paid=0,interest=0,pricePart=price;
 if(dp!=null&&dp>100)R.notes.push('Down payment above 100% of the price is not valid, so financing was ignored.');
 if(finOk){const down=price*dp/100,L=price-down,k=Math.min(N*12,n);pm=pmtOf(L,rate,yrs);paid=pm*k;const bal=balAfter(L,rate,yrs,k);interest=Math.max(0,paid-(L-bal));
  R.loan={L,pm,rate,yrs,down,bal,paid,interest,k,n};pricePart=down;R.up.push({l:'Down payment',v:down,n:dp+'% of price (percentage entered by you)',t:'calc'});
  const lf=nv(f.loanfee);if(lf==null)R.exUp.push('Loan processing fee');else{const a=L*lf/100;fees+=a;R.up.push({l:'Loan processing fee',v:a,n:lf+'% of the loan (percentage entered by you)',t:'calc'})}}
 else{R.up.push({l:'Purchase price, paid in full',v:price,n:have&&!(dp!=null&&dp>100)?'Financing is incomplete (needs down payment %, interest rate and term), so this is shown as an all-cash purchase.':'No financing entered, so this is shown as an all-cash purchase.',t:'fact'});if(nv(f.loanfee)!=null)R.notes.push('Loan processing fee ignored because financing is not complete.')}
 const o=am('oth0','Other one-time fees');if(o!=null)fees+=o;
 const rp=am('repair','Repair budget'),rn=am('reno','Renovation budget'),works=(rp||0)+(rn||0);
 let maint=nv(f.maint);if(maint==null&&+p.maint>0)maint=+p.maint;
 const rec=(l,v,n,t)=>R.rec.push({l,v,n,t});
 if(finOk)rec('Estimated mortgage payment',pm,'Level monthly payment from your down payment, rate ('+rate+'%) and term ('+yrs+' years). The lender may calculate differently.','calc');
 if(maint==null)R.exRec.push('Monthly maintenance');else rec('Monthly maintenance',maint,nv(f.maint)!=null?'Amount entered by you':'Listing field (user-supplied)','fact');
 const pt=nv(f.ptax);if(pt==null)R.exRec.push('Property tax');else rec('Property tax',pt/12,fm(pt)+' per year (entered by you) divided by 12','calc');
 const ins=nv(f.ins);if(ins==null)R.exRec.push('Insurance');else rec('Insurance',ins/12,fm(ins)+' per year (entered by you) divided by 12','calc');
 const om=nv(f.othm);if(om==null)R.exRec.push('Other monthly charges');else rec('Other monthly charges',om,'Amount entered by you','fact');
 R.notes.push('Recurring charges are held flat for every year (no increase is assumed because none was entered).');
 R.fees=fees;R.works=works;R.pricePart=pricePart;R.upTotal=pricePart+fees+works;R.upExPrice=fees+works;
 R.mon=sumA(R.rec.map(x=>x.v));R.pm=pm;R.monEx=R.mon-pm;R.ann=R.mon*12;R.paid=paid;R.interest=interest;

function rentCalc(p,N){N=N||FN;const f=p.fin||{},rent=+p.price>0?+p.price:null,area=+p.area>0?+p.area:null;
 const R={type:'rent',N,price:rent,area,up:[],rec:[],exUp:[],exRec:[],notes:[],upTotal:null,mon:null,ann:null,cash5:null,tco:null,pps:null,ppsm:null,deposit:0,partial:false};

 let dm=nv(f.depm),dsrc=' (entered by you)';if(dm==null){dm=nv(p.dep);dsrc=' (listing field, user-supplied)'}
 let up=0;
 if(dm==null)R.exUp.push('Security deposit');else{R.deposit=rent*dm;up+=R.deposit;R.up.push({l:'Security deposit (refundable)',v:R.deposit,n:dm+' months of rent'+dsrc,t:'calc'})}

 [['movein','Move-in and setup'],['oth0','Other one-time fees'],['reno','Fit-out or renovation budget']].forEach(([k,l])=>{const v=nv(f[k]);if(v==null)R.exUp.push(l);else{up+=v;R.up.push({l,v,n:'Amount entered by you',t:'fact'})}});
 let maint=nv(f.maint);if(maint==null&&+p.maint>0)maint=+p.maint;
 R.rec.push({l:'Monthly rent (year 1)',v:rent,n:'Listing field (user-supplied)',t:'fact'});
 if(maint==null)R.exRec.push('Monthly maintenance');else R.rec.push({l:'Monthly maintenance',v:maint,n:nv(f.maint)!=null?'Amount entered by you':'Listing field (user-supplied)',t:'fact'});
 const ins=nv(f.ins);if(ins==null)R.exRec.push('Contents or renter insurance');else R.rec.push({l:'Insurance',v:ins/12,n:fm(ins)+' per year (entered by you) divided by 12',t:'calc'});
 const om=nv(f.othm);if(om==null)R.exRec.push('Other monthly charges');else R.rec.push({l:'Other monthly charges',v:om,n:'Amount entered by you',t:'fact'});
 let e=nv(f.esc);if(e==null){R.exRec.push('Annual rent increase');R.notes.push('No annual rent increase entered, so rent is held flat for every year. This probably understates later years.');e=0}
 R.esc=e;R.upTotal=up;R.upExDep=up-R.deposit;R.mon=sumA(R.rec.map(x=>x.v));R.ann=R.mon*12;
 let rents=0;for(let y=0;y<N;y++)rents+=12*rent*Math.pow(1+e/100,y);R.rents=rents;
 R.cash5=up+rents+N*12*(R.mon-rent);R.tco=R.cash5-R.deposit;
 if(area){R.pps=rent/area;R.ppsm=R.pps*SQFT}
 R.partial=R.exUp.length>0||R.exRec.length>0;return R}
const calcFor=(p,N)=>p.type==='buy'?buyCalc(p,N):rentCalc(p,N);

/* rent versus buy over N years. Needs: a buy property with a price, a monthly rent, and a price growth figure you supply. */
function rvbCalc(g){const R=S.rvb||RVB0,N=Math.max(1,Math.min(40,Math.round(nv(R.N)||5))),miss=[],notes=[];
 const bp=S.props.find(p=>p.id===R.buy&&p.type==='buy');if(!bp)miss.push('a property for sale to evaluate');
 let rp=null;if(R.src&&R.src!=='manual')rp=S.props.find(p=>p.id===R.src&&p.type==='rent');
 if(!rp){const rent=nv(R.rent);if(!(rent>0))miss.push('a monthly rent (type one, or pick a saved rental)');else rp={type:'rent',price:rent,area:0,maint:nv(R.maint)||0,dep:nv(R.depm)==null?'':nv(R.depm),fin:{brokm:R.brokm,esc:R.esc}}}

 if(B.partial)notes.push('Some buying costs were left blank and are excluded: '+B.exUp.concat(B.exRec).join(', ')+'.');
